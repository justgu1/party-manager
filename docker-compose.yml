services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpparty
      POSTGRES_PASSWORD: helpparty
      POSTGRES_DB: helpparty
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpparty"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://helpparty:helpparty@db:5432/helpparty?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      HTTP_ADDR: ":8080"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-help-party <no-reply@help-party.local>}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://helpparty:helpparty@db:5432/helpparty?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
