# Temporary HTTP-only config used to answer the ACME challenge for the first
# certificate. Replaced by party.justgui.dev.conf once the cert exists.
server {
    listen 80;
    server_name party.justgui.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 200 "party bootstrap";
    }
}
